name: Test

# Lints, builds and runs the integration suite on a pushed branch, on the
# same native runners as the release. Publishes nothing.
on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: >-
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:v0.11.0 -x
          rootfs/usr/local/bin/entrypoint
          rootfs/usr/local/bin/healthcheck
          rootfs/usr/local/libexec/sftp/rsync-gate
          tests/run-tests.sh
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
      - name: Rust checks and advisories
        run: >-
          docker run --rm -v "$PWD/webui:/src" -w /src rust:1.100.0-slim-trixie
          sh -c 'rustup component add clippy
          && cargo clippy --locked --all-targets -- -D warnings
          && cargo test --locked
          && cargo install cargo-audit --version 0.23.0 --locked
          && cargo audit'

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            scope: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            scope: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          pull: true
          tags: sftp:ci
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}
      - name: Integration tests
        run: tests/run-tests.sh sftp:ci
