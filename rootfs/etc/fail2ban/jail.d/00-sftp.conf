# fail2ban defaults for the SFTP container.
#
# Override any of these in /config/fail2ban/jail.local or in
# /config/fail2ban/jail.d/*.local; fail2ban reads both after this file.

[DEFAULT]
banaction          = iptables-multiport
banaction_allports = iptables-allports
ignoreip           = 127.0.0.1/8 ::1
bantime            = 1h
findtime           = 10m
maxretry           = 5
# A repeat offender's ban doubles each time, up to one week. fail2ban
# looks the history up in its database, so dbpurgeage must exceed maxtime.
bantime.increment  = true
bantime.maxtime    = 1w

[sshd]
enabled   = true
mode      = normal
# The container runs nothing but sshd, so a banned address loses every
# port. That keeps bans effective when sshd listens on a custom port.
banaction = %(banaction_allports)s
backend   = polling
logpath   = /var/log/auth.log
