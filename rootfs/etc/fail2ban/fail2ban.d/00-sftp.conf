# fail2ban server settings for the SFTP container. Override them in
# /config/fail2ban/fail2ban.local.

[Definition]
# Logs go to the container log, which Docker rotates. A log file in
# /config would grow without bound, since nothing rotates it there.
logtarget  = STDOUT
# Bans and offender history survive container re-creation.
dbfile     = /config/fail2ban/fail2ban.sqlite3
dbpurgeage = 8d
socket     = /run/fail2ban/fail2ban.sock
pidfile    = /run/fail2ban/fail2ban.pid
