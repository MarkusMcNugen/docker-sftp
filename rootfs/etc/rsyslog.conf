# rsyslog for the SFTP container.
#
# sshd logs to /dev/log. Auth messages land in /var/log/auth.log, which
# fail2ban watches, and every message is also written to the container's
# stdout so `docker logs` shows it.
#
# Rate limiting is off on every socket: during a brute-force attack sshd
# logs hundreds of lines a second, and a dropped line is a failed login
# fail2ban never counts.

module(load="imuxsock"
       SysSock.Name="/dev/log"
       SysSock.RateLimit.Interval="0"
       SysSock.Annotate="off")

# One extra socket per chrooted user when SFTP_LOG_TRANSFERS is on, written
# by the entrypoint. A chrooted internal-sftp process can only reach
# /dev/log inside its own chroot.
include(file="/etc/rsyslog.d/*.conf" mode="optional")

template(name="Console" type="string"
         string="%timereported:::date-rfc3339% %syslogtag%%msg:::sp-if-no-1st-sp%%msg:::drop-last-lf%\n")

# The entrypoint rotates auth.log at SFTP_AUTH_LOG_MAX_BYTES by copying it
# and truncating it in place.
auth,authpriv.* action(type="omfile" file="/var/log/auth.log"
                       template="RSYSLOG_TraditionalFileFormat")
*.*             action(type="omfile" file="/dev/stdout" template="Console")
