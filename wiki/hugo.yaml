# Hugo + Hextra config for the SFTP wiki. Structure follows
# github.com/imfing/hextra-starter-template.

baseURL: https://markusmcnugen.github.io/docker-sftp/
title: SFTP Wiki
locale: en-us
enableRobotsTXT: true
enableGitInfo: true

module:
  hugoVersion:
    extended: true
    min: 0.166.0
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - identifier: docs
      name: Docs
      pageRef: /docs
      weight: 1
    - name: Search
      weight: 2
      params:
        type: search
    - name: GitHub
      weight: 3
      url: https://github.com/MarkusMcNugen/docker-sftp
      params:
        icon: github

params:
  description: A hardened OpenSSH SFTP server with chroot jails and fail2ban, in one container.

  navbar:
    displayTitle: true
    displayLogo: false

  page:
    width: wide
    # A reader who picks the Command line tab sees it in every tab group.
    tabs:
      sync: true

  # Screenshots open full size when clicked.
  imageZoom:
    enable: true

  theme:
    default: system
    displayToggle: true

  footer:
    displayCopyright: true
    displayPoweredBy: true

  editURL:
    enable: true
    base: https://github.com/MarkusMcNugen/docker-sftp/edit/main/wiki/content

  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward

  toc:
    displayTags: true
