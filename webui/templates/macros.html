{% macro sort(label, kind) %}<th class="sortable"{% if kind == "number" %} data-type="number"{% endif %}><button type="button" class="th-sort">{{ label }}<span class="s-none">{{ crate::assets::icon("arrows-down-up")|safe }}</span><span class="s-asc">{{ crate::assets::icon("arrow-up")|safe }}</span><span class="s-desc">{{ crate::assets::icon("arrow-down")|safe }}</span></button></th>{% endmacro %}
{% macro sort_in(label, kind, cls) %}<th class="sortable {{ cls }}"{% if kind == "number" %} data-type="number"{% endif %}><button type="button" class="th-sort">{{ label }}<span class="s-none">{{ crate::assets::icon("arrows-down-up")|safe }}</span><span class="s-asc">{{ crate::assets::icon("arrow-up")|safe }}</span><span class="s-desc">{{ crate::assets::icon("arrow-down")|safe }}</span></button></th>{% endmacro %}
{% macro help(text) %}<span class="help" tabindex="0" role="img" aria-label="{{ text }}" data-tip="{{ text }}">{{ crate::assets::icon("question")|safe }}</span>{% endmacro %}
