<tr><td class="lead"><div class="file-name"><span class="file-icon {{ r.look.tone }}">{{ crate::assets::icon(r.look.icon)|safe }}</span><a class="name" href="{{ r.href() }}"{% if r.kind != "dir" %} hx-boost="false"{% endif %}{% if r.kind == "file" %} download{% endif %}>{{ r.name }}</a></div></td><td data-label="In"><a class="mono" href="./?path={{ folder|urlencode }}">{{ folder }}</a></td><td class="opt-sm num" data-label="Size">{% if r.kind == "dir" %}<span class="muted">Folder</span>{% else %}{{ r.size }}{% endif %}</td><td data-label="Modified">{% if !r.iso.is_empty() %}<time datetime="{{ r.iso }}">{{ r.modified }}</time>{% endif %}</td></tr>
