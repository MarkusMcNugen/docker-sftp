[package]
name = "sftp-webui"
version = "2.2.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false
description = "Admin web UI of the docker-sftp image, and the root helper it talks to"

[[bin]]
name = "sftp-webui"
path = "src/bin/sftp-webui/main.rs"

[[bin]]
name = "sftp-helper"
path = "src/bin/sftp-helper/main.rs"

[dependencies]
anyhow = "1"
argon2 = "0.6"
askama = "0.16"
axum = { version = "0.8", default-features = false, features = ["form", "query"] }
base64 = "0.23"
flate2 = "1.1.11"
http-body = "1.1.0"
http-body-util = "0.1.5"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
maxminddb = "0.33.0"
qrcode = { version = "0.15", default-features = false, features = ["svg"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
ring = "0.17"
rusqlite = { version = "0.43", features = ["bundled"] }
rustix = { version = "1", features = ["net", "param", "process"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal", "process"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
totp-rs = { version = "6", features = ["otpauth"] }
tower = { version = "0.5", features = ["util"] }
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }

[profile.release]
lto = "thin"
strip = true
